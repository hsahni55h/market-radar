[project]
name = "market-radar"
version = "0.1.0"
description = "Personal Indian stock-market monitoring tool."
readme = "README.md"
authors = [
    { name = "Himanshu Sahni", email = "himanshu.sahni@volvo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
market-radar = "market_radar.__main__:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=src/market_radar --cov-report=term-missing"
markers = [
    "integration: tests that require internet access",
]
